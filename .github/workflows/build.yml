name: Build VencordForAndroid Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Bundle
        run: |
          npm ci
          npm run build

      - name: Check Bundle Syntax
        run: node --check dist/vencordforandroid.js

      - name: Upload Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vencordforandroid-dist
          path: |
            dist/vencordforandroid.js
            dist/manifest.json
